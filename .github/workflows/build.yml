name: Build iOS Workbench

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project HUALIUWorkbench.xcodeproj -scheme HUALIUWorkbench -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HUALIUWorkbench.app Payload/
          zip -r HUALIUWorkbench.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HUALIUWorkbench-ipa
          path: HUALIUWorkbench.ipa
