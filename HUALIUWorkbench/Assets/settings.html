<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>设置 · HUALIU工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:linear-gradient(145deg,#e8ecf1 0%,#d5dae0 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#1c1c1e;}
.container{width:100%;height:100%;display:flex;flex-direction:column;}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;flex-shrink:0;background:rgba(255,255,255,0.12);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:0.5px solid rgba(255,255,255,0.25);}
.header .brand{font-size:18px;font-weight:700;}
.header .brand span{color:#ffdd22;}
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.settings-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:4px 16px;border:0.5px solid rgba(255,255,255,0.2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:0.5px solid rgba(0,0,0,0.06);}
.settings-item:last-child{border-bottom:none;}
.settings-item .label{font-size:15px;font-weight:500;color:#1c1c1e;}
.settings-item .value{font-size:14px;color:rgba(0,0,0,0.4);}
.settings-item .arrow{color:rgba(0,0,0,0.25);font-size:18px;}
.app-info{text-align:center;padding:20px 0;}
.app-info .app-name{font-size:16px;font-weight:700;color:#1c1c1e;margin-top:8px;}
.app-info .app-version{font-size:13px;color:rgba(0,0,0,0.4);margin-top:4px;}
.app-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#ffdd22,#ffaa00);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:24px;font-weight:800;color:#1c1c1e;box-shadow:0 4px 16px rgba(255,170,0,0.3);}
.tab-bar{display:flex;justify-content:space-around;align-items:center;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,0.18);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top:0.5px solid rgba(255,255,255,0.25);flex-shrink:0;box-shadow:0 -4px 20px rgba(0,0,0,0.04);}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 16px;border-radius:14px;cursor:pointer;user-select:none;transition:all 0.2s;}
.tab-item.active{background:rgba(255,221,34,0.25);}
.tab-item svg{width:22px;height:22px;}
.tab-item .tab-label{font-size:10px;font-weight:600;color:rgba(0,0,0,0.5);}
.tab-item.active .tab-label{color:#1c1c1e;}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="brand">应用<span>设置</span></div>
</div>
<div class="content">
<div class="app-info">
<div class="app-logo">H</div>
<div class="app-name">HUALIU 工作台</div>
<div class="app-version">版本 1.0.0</div>
</div>
<div class="settings-card">
<div class="settings-item"><span class="label">客服工号</span><span class="value">8888</span></div>
<div class="settings-item"><span class="label">在线状态</span><span class="value" style="color:#34c759;">● 在线</span></div>
<div class="settings-item"><span class="label">消息提示音</span><span class="arrow">›</span></div>
</div>
<div class="settings-card">
<div class="settings-item"><span class="label">关于应用</span><span class="arrow">›</span></div>
<div class="settings-item"><span class="label">服务与支持</span><span class="arrow">›</span></div>
</div>
<div style="text-align:center;padding:10px 0;font-size:11px;color:rgba(0,0,0,0.25);">
©2025-2026 HUALIU<br>豫ICP备：32454687号
</div>
</div>

</body>
</html>
